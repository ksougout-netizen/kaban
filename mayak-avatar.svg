  <path d="M116.8 112 L139.2 112 L140.2 126 L115.8 126 Z" fill="#ef4444"/>
  <rect x="113" y="84" width="30" height="9" rx="2" fill="#1e293b"/>
  <rect x="118" y="66" width="20" height="18" rx="2" fill="#fde68a"/>
  <path d="M114 66 L128 54 L142 66 Z" fill="#1e293b"/>
  <rect x="124" y="160" width="8" height="10" rx="1.5" fill="#1e293b"/>
