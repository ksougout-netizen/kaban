<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset=".65" stop-color="#1d3b6e"/>
      <stop offset="1" stop-color="#2b5a8f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14365f"/>
      <stop offset="1" stop-color="#0a1c36"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset=".4" stop-color="#fde68a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="256" height="256" fill="url(#sky)"/>
  <circle cx="44" cy="44" r="1.8" fill="#fff" opacity=".85"/>
  <circle cx="92" cy="28" r="1.3" fill="#fff" opacity=".6"/>
  <circle cx="214" cy="66" r="1.5" fill="#fff" opacity=".7"/>
  <circle cx="30" cy="104" r="1.2" fill="#fff" opacity=".5"/>
  <!-- лучи -->
  <path d="M136 74 L256 34 L256 98 Z" fill="url(#beam)" opacity=".75" filter="url(#soft)"/>
  <path d="M120 74 L0 46 L0 96 Z" fill="url(#beam)" opacity=".35" filter="url(#soft)" transform="matrix(-1 0 0 1 256 0) translate(0 0)"/>
  <circle cx="128" cy="76" r="26" fill="url(#glow)"/>
  <!-- море -->
  <rect y="186" width="256" height="70" fill="url(#sea)"/>
  <path d="M0 196 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" stroke="#5fa8e8" stroke-width="2.5" fill="none" opacity=".55"/>
  <path d="M0 214 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0" stroke="#5fa8e8" stroke-width="2" fill="none" opacity=".35"/>
  <!-- скала -->
  <path d="M70 196 L92 168 L118 160 L146 162 L170 172 L190 196 Z" fill="#0a1426"/>
  <!-- башня -->
  <path d="M112 170 L118 92 L138 92 L144 170 Z" fill="#f8fafc"/>
